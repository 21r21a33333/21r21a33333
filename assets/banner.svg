  <text x="1206" y="52" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#6E7681">@21r21a33333</text>

  <text x="74" y="98" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" letter-spacing="6" fill="#6E7681">BLOCKCHAIN &amp; BACKEND ENGINEER</text>

