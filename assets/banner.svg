<svg width="100%" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Diwakar Matsa — Blockchain &amp; Backend Engineer</title>
  <desc>Dark banner. Name Diwakar Matsa in white with a rust-orange accent underline, subtitle Rust, Bitcoin, EVM, distributed systems, and a small animated routing-graph motif.</desc>

  <rect x="0" y="0" width="1280" height="300" rx="16" fill="#0D1117"/>
